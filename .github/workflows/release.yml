name: Release

on:
  release:
    types: [published]
  workflow_dispatch: # re-run a publish for the version in package.json (both steps skip what's already live)

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org
      - name: Tag matches package.json version
        if: github.event_name == 'release'
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p 'require("./package.json").version')"
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish to npm with provenance
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          v=$(node -p 'require("./package.json").version')
          if npm view "@tube2vid/mcp@$v" version >/dev/null 2>&1; then echo "@tube2vid/mcp@$v already on npm"; else npm publish --provenance --access public; fi
      - name: Publish to the MCP registry
        if: ${{ env.NODE_AUTH_TOKEN != '' }}
        run: |
          test "$(node -p 'require("./server.json").version')" = "$(node -p 'require("./package.json").version')"
          curl -sL "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          # npm can take a few minutes to expose a new version; the registry rejects it until then.
          for i in $(seq 1 20); do ./mcp-publisher publish && exit 0; sleep 30; done; exit 1
